<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แดชบอร์ดงานอุบัติเหตุ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f3f5f7; --card:#fff; --ink:#14232e; --mute:#5f7280; --line:#dde3e8;
  --a:#0e6b73; --b:#e0a43a; --c:#c8513a; --d:#6b7fa8; --ok:#1D9E75; --okbg:#e1f5ee; --okink:#085041; --wbg:#fae9c0; --wink:#633806;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1a21; --card:#17252e; --ink:#e8eef2; --mute:#93a5b2; --line:#2a3b46; --a:#3bb3bd; --b:#e8b753; --c:#e07a63; --d:#8da0c8; --okbg:#0f3a2e; --okink:#9fe1cb; --wbg:#4a3512; --wink:#fac775;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai",system-ui,sans-serif;line-height:1.5}
header{padding:20px clamp(16px,4vw,40px) 8px;display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between}
h1{margin:0;font-size:1.5rem;font-weight:700}
.sub{color:var(--mute);font-size:.85rem}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.controls label{font-size:.8rem;color:var(--mute)}
input,select,button{font:inherit;font-size:.9rem;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
button{cursor:pointer;background:var(--a);color:#fff;border-color:var(--a)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--b);outline-offset:2px}
main{padding:12px clamp(16px,4vw,40px) 40px;display:grid;gap:14px}
.score{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 24px;display:flex;flex-wrap:wrap;gap:28px;align-items:center}
.ringbox{position:relative;width:140px;height:140px;flex:none}
.ringbox svg{display:block}
.ringval{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringval b{font-size:1.9rem;font-weight:600;line-height:1.1}
.ringval b small{font-size:.9rem;font-weight:400;color:var(--mute)}
.ringval span{font-size:.75rem;color:var(--mute)}
.badge{display:inline-block;padding:4px 14px;border-radius:8px;font-weight:600;font-size:.9rem}
.badge.ok{background:var(--okbg);color:var(--okink)}
.badge.warn{background:var(--wbg);color:var(--wink)}
.score p{margin:8px 0 0;color:var(--mute);font-size:.95rem}
.trend.up{color:var(--ok)}.trend.down{color:var(--c)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.card h2{margin:0 0 10px;font-size:1rem;font-weight:600}
.s8{grid-column:span 8}.s4{grid-column:span 4}.s6{grid-column:span 6}.s12{grid-column:span 12}
@media(max-width:900px){.s8,.s4,.s6{grid-column:span 12}}
.chart{position:relative;height:260px}
.tablewrap{overflow:auto;max-height:420px}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--card);cursor:pointer}
td.n{text-align:right;font-variant-numeric:tabular-nums}
#msg{margin:0 clamp(16px,4vw,40px);padding:12px 16px;border:1px solid var(--c);border-radius:8px;color:var(--c);background:var(--card)}
</style>
</head>
<body>
<header>
  <div>
    <h1>แดชบอร์ดงานอุบัติเหตุ</h1>
    <div class="sub" id="updated">กำลังโหลดข้อมูล…</div>
    <div class="sub">นับตามวันที่บันทึกรายการรับแจ้ง</div>
  </div>
  <div class="controls">
    <label>วันที่รับแจ้งตั้งแต่ <input type="date" id="from"></label>
    <label>ถึง <input type="date" id="to"></label>
    <label>สถานะ <select id="status"><option value="">ทั้งหมด</option></select></label>
    <button id="reload">โหลดใหม่</button>
  </div>
</header>
<div id="msg" hidden></div>
<main>
  <section class="score">
    <div class="ringbox">
      <svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="คะแนนรวม">
        <circle cx="70" cy="70" r="60" fill="none" stroke="var(--line)" stroke-width="13"/>
        <circle id="arc" cx="70" cy="70" r="60" fill="none" stroke="var(--ok)" stroke-width="13" stroke-linecap="round" transform="rotate(-90 70 70)" stroke-dasharray="376.99" stroke-dashoffset="376.99"/>
      </svg>
      <div class="ringval"><b id="scoreV">–</b><span>คะแนนรวม</span></div>
    </div>
    <div>
      <span class="badge ok" id="badge">–</span>
      <p id="scoreSub"></p>
      <p id="trend"></p>
    </div>
  </section>
  <section class="grid">
    <div class="card s8"><h2>จำนวนงานและค่าใช้จ่ายรายวัน (ตามวันที่รับแจ้ง)</h2><div class="chart"><canvas id="cDaily"></canvas></div></div>
    <div class="card s4"><h2>สัดส่วนตามสถานะ</h2><div class="chart"><canvas id="cStatus"></canvas></div></div>
    <div class="card s6"><h2>ช่วงเวลาที่รับแจ้ง (ชั่วโมง)</h2><div class="chart"><canvas id="cHour"></canvas></div></div>
    <div class="card s6"><h2>จำนวนงานตามอัตราค่าสำรวจ</h2><div class="chart"><canvas id="cFee"></canvas></div></div>
    <div class="card s12">
      <h2>รายการทั้งหมด <input id="q" placeholder="ค้นหาเลขรับแจ้ง" style="margin-left:10px;min-width:230px"></h2>
      <div class="tablewrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>
    </div>
  </section>
</main>

<script>
/* ===== ตั้งค่า ===== */
const SHEET_ID  = "17Uh0ptdcQltDLTbb4y0vFZC5mmbflSxpSUGmrfnwfio";
const SHEET_TAB = "history_all";
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_TAB)}`;
const DONE = ["ส่งงานแล้ว"];

/* ===== เกณฑ์ KPI (แก้ให้ตรงกฎจริงของบริษัท) ===== */
const TARGET = 98;      // เป้าหมาย % ต่อ KPI
const SLA_H  = 24;      // ส่งงานภายในกี่ชั่วโมงหลังรับแจ้ง
const FEE_MAX = 600;    // เพดานค่าสำรวจ (บาท)

/* ===== ตัวช่วย ===== */
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString("th-TH");
let ALL = [], charts = {}, sortKey = "iso", sortDir = -1;

function parseCSV(t){
  const rows=[];let r=[],f="",q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c=='"'){ if(t[i+1]=='"'){f+='"';i++} else q=false } else f+=c }
    else if(c=='"') q=true;
    else if(c==','){r.push(f);f=""}
    else if(c=='\n'){r.push(f);rows.push(r);r=[];f=""}
    else if(c!='\r') f+=c;
  }
  if(f||r.length){r.push(f);rows.push(r)}
  return rows;
}
function toISO(s){
  s=(s||"").trim();
  let y,mo,d,m;
  if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})/))){y=+m[1];mo=m[2];d=m[3];}
  else if((m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/))){y=+m[3];mo=m[2].padStart(2,"0");d=m[1].padStart(2,"0");if(y>2400)y-=543;}
  else return "";
  return (y>=2020&&y<=2035)?`${y}-${mo}-${d}`:"";
}
function showMsg(t){ $("msg").hidden=!t; $("msg").textContent=t||""; }
const dmy = iso => iso.slice(8,10)+"/"+iso.slice(5,7)+"/"+iso.slice(0,4);
function prevDay(iso){
  const d=new Date(iso+"T12:00:00Z"); d.setUTCDate(d.getUTCDate()-1);
  return d.toISOString().slice(0,10);
}

async function load(){
  $("updated").textContent="กำลังโหลดข้อมูล…"; showMsg("");
  try{
    const res=await fetch(CSV_URL,{cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const text=await res.text();
    if(/^\s*<(!doctype|html)/i.test(text))
      throw new Error("ชีทไม่ได้แชร์ (ต้องตั้งเป็น ทุกคนที่มีลิงก์ > ผู้ดู) หรือไม่มีแท็บชื่อ "+SHEET_TAB);
    const rows=parseCSV(text);
    const header=rows.shift().map(h=>h.trim());
    const ix=n=>header.indexOf(n);
    const I={
      status:ix("สถานะ"), id:ix("เลขที่รับแจ้ง"),
      accD:ix("วันที่เกิดเหตุ"), accISO:ix("วันที่ ค.ศ."),
      nD:ix("วันที่บันทึกรับแจ้ง"), nT:ix("เวลาบันทึกรับแจ้ง"), nISO:ix("วันที่บันทึก ค.ศ."),
      fee:ix("ค่าใช้จ่ายสำรวจภัย"), hrs:ix("ชม.จากรับแจ้งถึงส่งงาน"), pulled:ix("ดึงข้อมูลเมื่อ")
    };
    if(I.id<0) throw new Error("ไม่พบคอลัมน์ เลขที่รับแจ้ง ในแท็บ "+SHEET_TAB+" (หัวคอลัมน์ที่พบ: "+header.slice(0,6).join(", ")+")");
    const map=new Map();
    rows.forEach(c=>{
      const g=v=>v>=0?(c[v]||"").trim():"";
      const o={
        status:g(I.status), id:g(I.id),
        d:g(I.nD)||g(I.accD),
        time:g(I.nT),
        fee:parseFloat(g(I.fee).replace(/,/g,""))||0,
        hrs:parseFloat(g(I.hrs)),
        pulled:g(I.pulled)
      };
      if(!o.id) return;
      o.iso=toISO(g(I.nISO))||toISO(g(I.nD))||toISO(g(I.accISO))||toISO(g(I.accD));
      o.hour=parseInt(o.time.split(":")[0],10);
      map.set(o.id,o);
    });
    ALL=[...map.values()];
    if(!ALL.length) throw new Error("อ่านชีทได้แต่ไม่มีแถวข้อมูล");
    const latest=ALL.map(x=>x.pulled).sort().pop();
    $("updated").textContent="ข้อมูลล่าสุดจากชีท: "+(latest||"-")+" •
